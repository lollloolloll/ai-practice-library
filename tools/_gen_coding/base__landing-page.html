<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>빈하우스 커피 구독</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: #333; line-height: 1.6; }
  header { display: flex; justify-content: space-between; align-items: center; padding: 16px 24px; background: #fff; border-bottom: 1px solid #eee; }
  .logo { font-weight: 700; font-size: 20px; color: #6f4e37; }
  nav a { margin-left: 16px; color: #555; text-decoration: none; font-size: 14px; }
  .hero { text-align: center; padding: 64px 24px; background: #f7f1eb; }
  .hero h1 { font-size: 36px; margin: 0 0 12px; color: #3e2723; }
  .hero p { font-size: 18px; color: #666; margin: 0 0 24px; }
  .btn { display: inline-block; padding: 12px 28px; background: #6f4e37; color: #fff; border-radius: 6px; text-decoration: none; border: 0; font-size: 16px; cursor: pointer; }
  section { padding: 48px 24px; max-width: 960px; margin: 0 auto; }
  h2 { text-align: center; color: #3e2723; }
  .features, .plans { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-top: 24px; }
  .card { padding: 24px; border: 1px solid #eee; border-radius: 8px; text-align: center; }
  .card h3 { margin-top: 0; }
  .price { font-size: 28px; font-weight: 700; color: #6f4e37; }
  footer { text-align: center; padding: 24px; background: #3e2723; color: #d7ccc8; font-size: 14px; }
  @media (max-width: 640px) { .features, .plans { grid-template-columns: 1fr; } nav { display: none; } .hero h1 { font-size: 28px; } }
</style>
</head>
<body>
<header>
  <div class="logo">☕ 빈하우스</div>
  <nav><a href="#features">특징</a><a href="#plans">요금제</a><a href="#plans">구독하기</a></nav>
</header>
<div class="hero">
  <h1>매주 신선한 원두를 문 앞까지</h1>
  <p>로스팅 후 48시간 안에 배송되는 스페셜티 커피 구독 서비스</p>
  <a class="btn" href="#plans">지금 구독하기</a>
</div>
<section id="features">
  <h2>왜 빈하우스인가요?</h2>
  <div class="features">
    <div class="card"><h3>🌱 신선함</h3><p>주문 후 로스팅해 바로 발송합니다.</p></div>
    <div class="card"><h3>🌍 다양한 산지</h3><p>매달 새로운 산지의 원두를 소개합니다.</p></div>
    <div class="card"><h3>🚚 무료 배송</h3><p>모든 구독은 배송비가 무료입니다.</p></div>
  </div>
</section>
<section id="plans">
  <h2>요금제</h2>
  <div class="plans">
    <div class="card"><h3>라이트</h3><div class="price">₩15,900</div><p>월 200g</p><button class="btn">선택</button></div>
    <div class="card"><h3>스탠다드</h3><div class="price">₩27,900</div><p>월 400g</p><button class="btn">선택</button></div>
    <div class="card"><h3>프리미엄</h3><div class="price">₩49,900</div><p>월 800g</p><button class="btn">선택</button></div>
  </div>
</section>
<footer>© 2024 빈하우스 커피. All rights reserved.</footer>
</body>
</html>
