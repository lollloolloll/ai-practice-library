<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>튀는 공 — 이징</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1e1e2e; font-family: system-ui, sans-serif; color: #ddd; }
  canvas { display: block; }
  .ui { position: fixed; top: 8px; left: 8px; right: 8px; display: flex; flex-wrap: wrap; gap: 4px; font-size: 12px; align-items: center; }
  .ui button { background: #2c2c44; color: #ddd; border: 1px solid #44446a; border-radius: 6px; padding: 5px 9px; cursor: pointer; font-size: 12px; }
  .ui button.on { background: #c77dff; border-color: #c77dff; color: #111; }
  .hint { position: fixed; bottom: 8px; left: 12px; font-size: 12px; color: #999; }
</style>
</head>
<body>
<div class="ui" id="ui"></div>
<div class="hint">아무 곳이나 클릭하면 공이 선택한 이징으로 이동합니다 · 오른쪽 아래: 이징 곡선</div>
<canvas id="c"></canvas>
<script>
  const canvas = document.getElementById('c'), ctx = canvas.getContext('2d');
  let W, H; function resize() { W = canvas.width = innerWidth; H = canvas.height = innerHeight; } addEventListener('resize', resize); resize();
  const Ease = {
    linear: t => t,
    easeOutCubic: t => 1 - Math.pow(1 - t, 3),
    easeInOutQuad: t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2,
    easeOutBack: t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); },
    easeOutElastic: t => t === 0 || t === 1 ? t : Math.pow(2, -10 * t) * Math.sin((t * 10 - .75) * (2 * Math.PI / 3)) + 1,
    easeOutBounce: t => { const n = 7.5625, d = 2.75; if (t < 1 / d) return n * t * t; if (t < 2 / d) return n * (t -= 1.5 / d) * t + .75; if (t < 2.5 / d) return n * (t -= 2.25 / d) * t + .9375; return n * (t -= 2.625 / d) * t + .984375; }
  };
  let cur = 'easeOutBounce';
  const ui = document.getElementById('ui');
  Object.keys(Ease).forEach(k => { const b = document.createElement('button'); b.textContent = k; if (k === cur) b.classList.add('on'); b.onclick = () => { cur = k; [...ui.children].forEach(x => x.classList.toggle('on', x === b)); }; ui.appendChild(b); });

  // 간단한 트윈 엔진: from → to를 duration 동안 ease 함수로 보간
  const tweens = [];
  function tween(obj, to, dur, ease, onDone) { tweens.push({ obj, from: Object.fromEntries(Object.keys(to).map(k => [k, obj[k]])), to, dur, t: 0, ease, onDone }); }
  const ball = { x: W / 2, y: H / 2, r: 22, s: 1 };
  const ghosts = [];
  canvas.addEventListener('click', e => {
    tweens.length = 0; ghosts.length = 0;
    tween(ball, { x: e.clientX, y: e.clientY }, .9, Ease[cur]);
    ball.s = .7; tween(ball, { s: 1 }, .5, Ease.easeOutBack);
    target = { x: e.clientX, y: e.clientY };
  });
  let target = null, prog = 0;
  function update(dt) {
    for (let i = tweens.length - 1; i >= 0; i--) {
      const tw = tweens[i]; tw.t = Math.min(1, tw.t + dt / tw.dur); const k = tw.ease(tw.t);
      for (const p in tw.to) tw.obj[p] = tw.from[p] + (tw.to[p] - tw.from[p]) * k;
      if ('x' in tw.to) { prog = tw.t; if (Math.random() < .5) ghosts.push({ x: ball.x, y: ball.y }); }
      if (tw.t >= 1) { tweens.splice(i, 1); tw.onDone && tw.onDone(); }
    }
  }
  function draw() {
    ctx.fillStyle = '#1e1e2e'; ctx.fillRect(0, 0, W, H);
    ghosts.forEach(g => { ctx.fillStyle = 'rgba(199,125,255,.15)'; ctx.beginPath(); ctx.arc(g.x, g.y, 4, 0, 7); ctx.fill(); });
    if (target) { ctx.strokeStyle = '#555'; ctx.setLineDash([4, 4]); ctx.beginPath(); ctx.arc(target.x, target.y, 26, 0, 7); ctx.stroke(); ctx.setLineDash([]); }
    ctx.fillStyle = '#c77dff'; ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.r * ball.s, 0, Math.PI * 2); ctx.fill();
    // 곡선 그래프
    const gw = Math.min(160, W * .35), gh = gw * .8, gx = W - gw - 16, gy = H - gh - 34;
    ctx.fillStyle = 'rgba(0,0,0,.45)'; ctx.fillRect(gx - 8, gy - 22, gw + 16, gh + 52);
    ctx.strokeStyle = '#444'; ctx.strokeRect(gx, gy, gw, gh);
    ctx.strokeStyle = '#c77dff'; ctx.lineWidth = 2; ctx.beginPath();
    for (let i = 0; i <= 60; i++) { const t = i / 60, y = gy + gh - Ease[cur](t) * gh; i ? ctx.lineTo(gx + t * gw, y) : ctx.moveTo(gx, y); } ctx.stroke(); ctx.lineWidth = 1;
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(gx + prog * gw, gy + gh - Ease[cur](prog) * gh, 4, 0, 7); ctx.fill();
    ctx.fillStyle = '#ccc'; ctx.font = '11px ui-monospace, monospace'; ctx.fillText(cur, gx, gy - 8);
  }
  let last = performance.now();
  (function loop(now) { const dt = Math.min(.033, (now - last) / 1000); last = now; update(dt); draw(); requestAnimationFrame(loop); })(last);
  // 처음에 데모 이동
  setTimeout(() => canvas.dispatchEvent(new MouseEvent('click', { clientX: W * .25, clientY: H * .7 })), 400);
</script>
</body>
</html>
