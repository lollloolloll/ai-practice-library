<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>할 일 목록</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 28px 16px; background: #fdf3d8; background-image: radial-gradient(#00000022 1px, transparent 1px); background-size: 18px 18px; font-family: "Space Grotesk", system-ui, sans-serif; color: #000; }
  .app { max-width: 480px; margin: 0 auto; background: #fff; border: 3px solid #000; box-shadow: 8px 8px 0 #000; padding: 22px; }
  h1 { font-family: "Black Han Sans", sans-serif; font-weight: 400; font-size: 40px; margin: 0 0 18px; line-height: 1; display: flex; align-items: center; gap: 10px; }
  .tag { font: 700 13px "Space Grotesk"; background: #ff6b6b; border: 3px solid #000; padding: 2px 8px; transform: rotate(-4deg); box-shadow: 3px 3px 0 #000; }
  form { display: flex; gap: 10px; margin-bottom: 18px; }
  input[type=text] { flex: 1; min-width: 0; padding: 12px; border: 3px solid #000; font: 700 15px "Space Grotesk", sans-serif; background: #fff; outline: none; }
  input[type=text]:focus { background: #fffbd1; box-shadow: 4px 4px 0 #000; }
  button { font: 700 15px "Space Grotesk", sans-serif; cursor: pointer; border: 3px solid #000; box-shadow: 4px 4px 0 #000; transition: transform .08s, box-shadow .08s; }
  button:active { transform: translate(4px, 4px); box-shadow: 0 0 0 #000; }
  .add { background: #ffd23f; padding: 0 18px; }
  ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; }
  li { display: flex; align-items: center; gap: 12px; padding: 12px; border: 3px solid #000; background: #a3e4ff; font-weight: 700; }
  li:nth-child(3n+2) { background: #c4f5a0; } li:nth-child(3n) { background: #ffc6e5; }
  li.done { background: #eee !important; }
  li.done span { text-decoration: line-through 3px; }
  li span { flex: 1; }
  .chk { width: 28px; height: 28px; background: #fff; padding: 0; box-shadow: 2px 2px 0 #000; font-size: 16px; line-height: 1; }
  .del { background: #ff6b6b; padding: 4px 10px; box-shadow: 2px 2px 0 #000; font-size: 13px; }
  .count { margin-top: 18px; display: inline-block; background: #000; color: #ffd23f; padding: 6px 12px; font-weight: 700; }
</style>
</head>
<body>
<div class="app">
  <h1>할 일 목록 <span class="tag">TODO!</span></h1>
  <form id="form"><input type="text" id="input" placeholder="뭐 해야 돼?"><button class="add">추가 +</button></form>
  <ul id="list"></ul>
  <div class="count" id="count"></div>
</div>
<script>
  // 폼 제출이 막힌 환경(sandbox iframe 등)에서도 동작하도록 submit 이벤트 대신 버튼 클릭·Enter를 직접 처리
  function bindSubmit(form, handler) {
    const run = (ev, submitter) => { ev.preventDefault(); handler({ target: form, submitter, preventDefault() {} }); };
    form.addEventListener('click', ev => { const b = ev.target.closest('button'); if (b && b.type === 'submit' && !b.disabled) run(ev, b); });
    form.addEventListener('keydown', ev => { if (ev.key === 'Enter' && !ev.isComposing && ev.target.matches('input:not([type=checkbox])')) { const b = form.querySelector('button:not([type=button])'); if (!b || !b.disabled) run(ev, b); } });
  }
  let todos = [{ text: '장보기', done: false }, { text: '운동하기', done: true }, { text: '보고서 작성', done: false }];
  const list = document.getElementById('list');
  function render() {
    list.innerHTML = '';
    todos.forEach(t => {
      const li = document.createElement('li'); if (t.done) li.className = 'done';
      li.innerHTML = '<button class="chk" aria-label="완료">' + (t.done ? '✔' : '') + '</button><span></span><button class="del">삭제</button>';
      li.querySelector('span').textContent = t.text;
      li.querySelector('.chk').onclick = () => { t.done = !t.done; render(); };
      li.querySelector('.del').onclick = () => { todos = todos.filter(x => x !== t); render(); };
      list.appendChild(li);
    });
    document.getElementById('count').textContent = `남은 할 일: ${todos.filter(t => !t.done).length}개`;
  }
  bindSubmit(document.getElementById('form'), e => { e.preventDefault(); const i = document.getElementById('input'); const v = i.value.trim(); if (!v) return; todos.push({ text: v, done: false }); i.value = ''; render(); });
  render();
</script>
</body>
</html>
