<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>매출 대시보드</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; padding: 22px 16px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: #fff; background: #1a1240; position: relative; overflow-x: hidden; }
  .blob { position: fixed; border-radius: 50%; filter: blur(60px); opacity: .85; z-index: -1; animation: drift 14s ease-in-out infinite alternate; }
  .b1 { width: 380px; height: 380px; background: #ff4fa3; top: -80px; left: -60px; }
  .b2 { width: 420px; height: 420px; background: #4f7bff; bottom: -120px; right: -80px; animation-delay: -5s; }
  .b3 { width: 260px; height: 260px; background: #22e0c4; top: 40%; left: 45%; animation-delay: -9s; }
  @keyframes drift { to { transform: translate(40px, 30px) scale(1.1); } }
  .glass { background: rgba(255,255,255,.12); backdrop-filter: blur(18px) saturate(160%); -webkit-backdrop-filter: blur(18px) saturate(160%); border: 1px solid rgba(255,255,255,.25); border-radius: 18px; box-shadow: 0 8px 32px rgba(10,5,40,.25), inset 0 1px 0 rgba(255,255,255,.3); }
  h1 { font-size: 22px; margin: 0; font-weight: 700; }
  .top { display: flex; justify-content: space-between; align-items: center; padding: 14px 18px; margin-bottom: 14px; }
  .chip { font-size: 12px; padding: 6px 12px; border-radius: 999px; background: rgba(255,255,255,.18); border: 1px solid rgba(255,255,255,.3); }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; margin-bottom: 14px; }
  .kpi { padding: 16px 18px; }
  .kpi .label { font-size: 13px; color: rgba(255,255,255,.75); }
  .kpi .value { font-size: 24px; font-weight: 700; margin-top: 4px; text-shadow: 0 2px 12px rgba(0,0,0,.2); }
  .kpi .d { font-size: 12px; margin-top: 2px; display: inline-block; padding: 2px 8px; border-radius: 999px; background: rgba(34,224,196,.25); }
  .kpi .d.neg { background: rgba(255,79,163,.3); }
  .panel { padding: 18px; }
  .panel h2 { font-size: 16px; margin: 0 0 12px; font-weight: 600; }
  .chart-wrap { position: relative; height: 250px; }
</style>
</head>
<body>
<div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
<div class="glass top"><h1>매출 대시보드</h1><span class="chip">2024년 · 전체 채널</span></div>
<div class="kpis">
  <div class="glass kpi"><div class="label">총 매출</div><div class="value">₩48,250,000</div><span class="d">▲ 12.5%</span></div>
  <div class="glass kpi"><div class="label">주문 수</div><div class="value">1,284</div><span class="d">▲ 8.1%</span></div>
  <div class="glass kpi"><div class="label">평균 주문 금액</div><div class="value">₩37,580</div><span class="d">▲ 4.0%</span></div>
  <div class="glass kpi"><div class="label">환불률</div><div class="value">2.3%</div><span class="d neg">▲ 0.4%p</span></div>
</div>
<div class="glass panel">
  <h2>월별 매출 추이</h2>
  <div class="chart-wrap"><canvas id="chart"></canvas></div>
</div>
<script>
  const ctx = document.getElementById('chart').getContext('2d');
  const grad = ctx.createLinearGradient(0, 0, 0, 250); grad.addColorStop(0, 'rgba(255,255,255,.45)'); grad.addColorStop(1, 'rgba(255,255,255,0)');
  Chart.defaults.color = 'rgba(255,255,255,.8)';
  new Chart(ctx, {
    type: 'line',
    data: { labels: ['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'], datasets: [{ data: [3200, 3500, 3100, 3900, 4200, 4000, 4500, 4700, 4300, 4900, 5200, 4825], borderColor: '#fff', borderWidth: 2.5, backgroundColor: grad, fill: true, tension: .4, pointBackgroundColor: '#fff', pointRadius: 3 }] },
    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { x: { grid: { color: 'rgba(255,255,255,.08)' } }, y: { grid: { color: 'rgba(255,255,255,.12)' } } } }
  });
</script>
</body>
</html>
