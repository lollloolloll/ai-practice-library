<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>튀는 공 — 패럴랙스</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #fbd3a0; font-family: system-ui, sans-serif; }
  canvas { display: block; touch-action: none; }
  .hint { position: fixed; top: 8px; left: 12px; font-size: 12px; color: #5a2e1a; background: rgba(255,255,255,.5); padding: 4px 8px; border-radius: 6px; }
</style>
</head>
<body>
<div class="hint">공이 오른쪽으로 굴러갑니다 · 누르고 있으면 가속 · 레이어별 스크롤 속도: 0.05 / 0.15 / 0.35 / 0.6 / 1.0</div>
<canvas id="c"></canvas>
<script>
  const canvas = document.getElementById('c'), ctx = canvas.getContext('2d');
  let W, H; function resize() { W = canvas.width = innerWidth; H = canvas.height = innerHeight; } addEventListener('resize', resize); resize();
  // 레이어마다 결정적인 높이 함수 (같은 x → 같은 모양) 로 끝없이 이어지는 배경
  const wave = (x, seed, f) => Math.sin(x * f + seed) * .5 + Math.sin(x * f * 2.3 + seed * 1.7) * .3 + Math.sin(x * f * 5.1 + seed * .3) * .2;
  const layers = [
    { speed: .15, color: '#e8a37c', base: .50, amp: .14, f: .004, seed: 1 },
    { speed: .35, color: '#c46f5a', base: .60, amp: .12, f: .006, seed: 4 },
    { speed: .60, color: '#7d3f4d', base: .70, amp: .08, f: .010, seed: 9 },
  ];
  const clouds = Array.from({ length: 7 }, (_, i) => ({ x: i * 260 + Math.random() * 100, y: 30 + Math.random() * 90, s: .6 + Math.random() * .8 }));
  const trees = Array.from({ length: 30 }, (_, i) => ({ x: i * 140 + Math.random() * 80, h: 30 + Math.random() * 40 }));
  const ball = { x: 0, y: 0, vy: 0, r: 18, rot: 0 }; let camX = 0, speed = 200, boost = false;
  canvas.addEventListener('pointerdown', () => boost = true); addEventListener('pointerup', () => boost = false);
  let last = performance.now();
  function loop(now) {
    const dt = Math.min(.033, (now - last) / 1000); last = now;
    speed += ((boost ? 650 : 200) - speed) * Math.min(1, dt * 3);
    camX += speed * dt;
    const floor = H * .86;
    ball.vy += 1600 * dt; ball.y += ball.vy * dt;
    if (ball.y > floor - ball.r) { ball.y = floor - ball.r; ball.vy = -Math.max(520, Math.abs(ball.vy) * .8); }
    ball.rot += speed * dt / ball.r;
    // 하늘
    const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#ffb88c'); g.addColorStop(1, '#ffe7c2'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    // 태양 (거의 고정: 0.05)
    ctx.fillStyle = '#fff4d6'; ctx.beginPath(); ctx.arc(W * .75 - (camX * .05) % (W + 200), H * .3, 50, 0, 7); ctx.fill();
    // 구름 (0.1, 개별 루프)
    ctx.fillStyle = 'rgba(255,255,255,.75)';
    for (const c of clouds) { const span = 7 * 260, x = ((c.x - camX * .1) % span + span) % span - 120; ctx.beginPath(); ctx.ellipse(x, c.y, 60 * c.s, 18 * c.s, 0, 0, 7); ctx.ellipse(x + 30 * c.s, c.y - 10 * c.s, 34 * c.s, 18 * c.s, 0, 0, 7); ctx.fill(); }
    // 산 레이어들
    for (const L of layers) {
      ctx.fillStyle = L.color; ctx.beginPath(); ctx.moveTo(0, H);
      for (let x = 0; x <= W + 8; x += 8) ctx.lineTo(x, H * L.base - wave(x + camX * L.speed, L.seed, L.f) * H * L.amp);
      ctx.lineTo(W, H); ctx.fill();
    }
    // 가까운 나무 (1.0 = 땅과 같은 속도)
    ctx.fillStyle = '#3d1f2b';
    for (const t of trees) { const span = 30 * 140, x = ((t.x - camX) % span + span) % span - 40; ctx.fillRect(x - 3, floor - t.h, 6, t.h); ctx.beginPath(); ctx.moveTo(x - 18, floor - t.h + 20); ctx.lineTo(x, floor - t.h - 26); ctx.lineTo(x + 18, floor - t.h + 20); ctx.fill(); }
    // 땅
    ctx.fillStyle = '#3d1f2b'; ctx.fillRect(0, floor, W, H - floor);
    ctx.fillStyle = '#5a2e3c'; for (let x = -((camX) % 40); x < W; x += 40) ctx.fillRect(x, floor + 8, 20, 4);
    // 공 (화면 고정 x, 세계가 움직임)
    ball.x = W * .3;
    ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.beginPath(); ctx.ellipse(ball.x, floor + 2, ball.r * (1 - (floor - ball.y) / H), 4, 0, 0, 7); ctx.fill();
    ctx.save(); ctx.translate(ball.x, ball.y); ctx.rotate(ball.rot); ctx.fillStyle = '#ffd93d'; ctx.beginPath(); ctx.arc(0, 0, ball.r, 0, 7); ctx.fill();
    ctx.strokeStyle = '#e09b00'; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(-ball.r, 0); ctx.lineTo(ball.r, 0); ctx.stroke(); ctx.restore();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
</script>
</body>
</html>
