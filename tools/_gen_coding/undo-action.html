<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>할 일 목록</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: #f4f5f7; margin: 0; padding: 24px 16px; color: #222; }
  .app { max-width: 480px; margin: 0 auto; background: #fff; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,.1); padding: 20px; }
  h1 { font-size: 22px; margin: 0 0 16px; }
  form { display: flex; gap: 8px; margin-bottom: 16px; }
  input[type=text] { flex: 1; min-width: 0; padding: 8px 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
  button { padding: 8px 14px; border: 0; border-radius: 4px; background: #4a6cf7; color: #fff; cursor: pointer; font-size: 14px; }
  ul { list-style: none; padding: 0; margin: 0; }
  li { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid #eee; }
  li span { flex: 1; } li.done span { text-decoration: line-through; color: #999; }
  li.back { animation: back .6s; } @keyframes back { from { background: #fff7c2; } }
  .del { background: none; color: #c33; padding: 4px 8px; }
  .tools { display: flex; justify-content: space-between; margin-top: 12px; font-size: 13px; color: #666; align-items: center; }
  .clear { background: none; color: #666; text-decoration: underline; padding: 0; font-size: 13px; }
  .snack { position: fixed; left: 50%; bottom: 20px; transform: translate(-50%, 120px); background: #323232; color: #fff; padding: 10px 10px 10px 16px; border-radius: 8px; display: flex; gap: 16px; align-items: center; font-size: 14px; transition: transform .25s; max-width: calc(100vw - 32px); box-shadow: 0 6px 20px rgba(0,0,0,.25); }
  .snack.show { transform: translate(-50%, 0); }
  .snack button { background: none; color: #8ab4ff; font-weight: 700; padding: 6px 8px; }
  .snack .t { font-size: 12px; color: #aaa; }
</style>
</head>
<body>
<div class="app">
  <h1>할 일 목록</h1>
  <form id="form"><input type="text" id="input" placeholder="할 일을 입력하세요"><button>추가</button></form>
  <ul id="list"></ul>
  <div class="tools"><span id="count"></span><button class="clear" id="clear">완료 항목 모두 삭제</button></div>
</div>
<div class="snack" id="snack" role="status"><span id="snackMsg"></span><span class="t" id="sec"></span><button id="undo">실행 취소</button></div>
<script>
  // 폼 제출이 막힌 환경(sandbox iframe 등)에서도 동작하도록 submit 이벤트 대신 버튼 클릭·Enter를 직접 처리
  function bindSubmit(form, handler) {
    const run = (ev, submitter) => { ev.preventDefault(); handler({ target: form, submitter, preventDefault() {} }); };
    form.addEventListener('click', ev => { const b = ev.target.closest('button'); if (b && b.type === 'submit' && !b.disabled) run(ev, b); });
    form.addEventListener('keydown', ev => { if (ev.key === 'Enter' && !ev.isComposing && ev.target.matches('input:not([type=checkbox])')) { const b = form.querySelector('button:not([type=button])'); if (!b || !b.disabled) run(ev, b); } });
  }
  let todos = [{ id: 1, text: '장보기', done: false }, { id: 2, text: '운동하기', done: true }, { id: 3, text: '보고서 작성', done: false }, { id: 4, text: '세탁소 들르기', done: true }];
  const list = document.getElementById('list');
  let lastSnapshot = null, timer = null, tick = null, restored = [];
  // 확인창(confirm) 대신: 즉시 삭제 → 5초간 되돌리기 가능
  function removeWithUndo(ids, msg) {
    lastSnapshot = todos.map(t => ({ ...t })); restored = ids;
    todos = todos.filter(t => !ids.includes(t.id)); render();
    const snack = document.getElementById('snack'); document.getElementById('snackMsg').textContent = msg; snack.classList.add('show');
    let s = 5; document.getElementById('sec').textContent = s + '초';
    clearTimeout(timer); clearInterval(tick);
    tick = setInterval(() => { s--; document.getElementById('sec').textContent = s + '초'; }, 1000);
    timer = setTimeout(() => { snack.classList.remove('show'); clearInterval(tick); lastSnapshot = null; }, 5000);
  }
  document.getElementById('undo').onclick = () => {
    if (!lastSnapshot) return; todos = lastSnapshot; lastSnapshot = null;
    clearTimeout(timer); clearInterval(tick); document.getElementById('snack').classList.remove('show'); render(restored);
  };
  document.addEventListener('keydown', e => { if ((e.ctrlKey || e.metaKey) && e.key === 'z') document.getElementById('undo').click(); });
  function render(highlight = []) {
    list.innerHTML = '';
    todos.forEach(t => {
      const li = document.createElement('li'); li.className = (t.done ? 'done ' : '') + (highlight.includes(t.id) ? 'back' : '');
      li.innerHTML = '<input type="checkbox"' + (t.done ? ' checked' : '') + '><span></span><button class="del">삭제</button>';
      li.querySelector('span').textContent = t.text;
      li.querySelector('input').onchange = () => { t.done = !t.done; render(); };
      li.querySelector('.del').onclick = () => removeWithUndo([t.id], `"${t.text}" 삭제됨`);
      list.appendChild(li);
    });
    document.getElementById('count').textContent = `남은 할 일 ${todos.filter(t => !t.done).length}개`;
  }
  document.getElementById('clear').onclick = () => { const ids = todos.filter(t => t.done).map(t => t.id); if (ids.length) removeWithUndo(ids, `완료 항목 ${ids.length}개 삭제됨`); };
  bindSubmit(document.getElementById('form'), e => { e.preventDefault(); const i = document.getElementById('input'); const v = i.value.trim(); if (!v) return; todos.push({ id: Date.now(), text: v, done: false }); i.value = ''; render(); });
  render();
</script>
</body>
</html>
