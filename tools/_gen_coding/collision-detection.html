<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>튀는 공 — 충돌</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1e1e2e; font-family: system-ui, sans-serif; color: #ddd; }
  canvas { display: block; }
  .hud { position: fixed; top: 10px; left: 12px; font-size: 13px; background: rgba(0,0,0,.4); padding: 6px 10px; border-radius: 6px; }
  .hud label { margin-left: 8px; }
</style>
</head>
<body>
<div class="hud">충돌 <b id="hits">0</b>회 · 클릭으로 공 추가 <label><input type="checkbox" id="boxes"> AABB 표시</label></div>
<canvas id="c"></canvas>
<script>
  const canvas = document.getElementById('c'), ctx = canvas.getContext('2d');
  let W, H; function resize() { W = canvas.width = innerWidth; H = canvas.height = innerHeight; } addEventListener('resize', resize); resize();
  const colors = ['#ff6b6b', '#ffd93d', '#6bcb77', '#4d96ff', '#c77dff'];
  const balls = []; let hits = 0;
  function add(x, y) {
    const r = 14 + Math.random() * 18;
    balls.push({ x, y, r, m: r * r, vx: (Math.random() - .5) * 320, vy: (Math.random() - .5) * 320, c: colors[balls.length % 5], flash: 0 });
  }
  for (let i = 0; i < 12; i++) add(40 + Math.random() * (W - 80), 40 + Math.random() * (H - 80));
  canvas.addEventListener('click', e => add(e.clientX, e.clientY));

  // 원-원 충돌: 1) AABB로 빠르게 거르고 2) 거리 비교 3) 겹침 분리 4) 법선 방향 탄성 충돌
  function collide(a, b) {
    if (Math.abs(a.x - b.x) > a.r + b.r || Math.abs(a.y - b.y) > a.r + b.r) return;   // AABB broad check
    const dx = b.x - a.x, dy = b.y - a.y, dist = Math.hypot(dx, dy), min = a.r + b.r;
    if (dist >= min || dist === 0) return;
    const nx = dx / dist, ny = dy / dist, overlap = (min - dist) / 2;
    a.x -= nx * overlap; a.y -= ny * overlap; b.x += nx * overlap; b.y += ny * overlap;
    const rel = (b.vx - a.vx) * nx + (b.vy - a.vy) * ny;
    if (rel > 0) return;                                  // 이미 멀어지는 중
    const j = -2 * rel / (1 / a.m + 1 / b.m);
    a.vx -= j * nx / a.m; a.vy -= j * ny / a.m; b.vx += j * nx / b.m; b.vy += j * ny / b.m;
    a.flash = b.flash = 1; hits++;
  }
  function update(dt) {
    for (const b of balls) {
      b.x += b.vx * dt; b.y += b.vy * dt;
      if (b.x < b.r) { b.x = b.r; b.vx = Math.abs(b.vx); b.flash = .6; }
      if (b.x > W - b.r) { b.x = W - b.r; b.vx = -Math.abs(b.vx); b.flash = .6; }
      if (b.y < b.r) { b.y = b.r; b.vy = Math.abs(b.vy); b.flash = .6; }
      if (b.y > H - b.r) { b.y = H - b.r; b.vy = -Math.abs(b.vy); b.flash = .6; }
      b.flash = Math.max(0, b.flash - dt * 4);
    }
    for (let i = 0; i < balls.length; i++) for (let k = i + 1; k < balls.length; k++) collide(balls[i], balls[k]);
  }
  function draw() {
    ctx.fillStyle = '#1e1e2e'; ctx.fillRect(0, 0, W, H);
    const showBox = document.getElementById('boxes').checked;
    for (const b of balls) {
      ctx.fillStyle = b.c; ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.fill();
      if (b.flash > 0) { ctx.strokeStyle = `rgba(255,255,255,${b.flash})`; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(b.x, b.y, b.r + 3, 0, Math.PI * 2); ctx.stroke(); }
      if (showBox) { ctx.strokeStyle = 'rgba(255,255,255,.3)'; ctx.lineWidth = 1; ctx.strokeRect(b.x - b.r, b.y - b.r, b.r * 2, b.r * 2); }
    }
    document.getElementById('hits').textContent = hits;
  }
  let last = performance.now();
  (function loop(now) { const dt = Math.min(.033, (now - last) / 1000); last = now; update(dt); draw(); requestAnimationFrame(loop); })(last);
</script>
</body>
</html>
