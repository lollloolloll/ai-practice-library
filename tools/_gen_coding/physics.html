<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>튀는 공 — 물리</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1e1e2e; font-family: system-ui, sans-serif; color: #ddd; }
  canvas { display: block; touch-action: none; cursor: grab; }
  .panel { position: fixed; top: 10px; left: 10px; background: rgba(20,20,35,.8); padding: 10px 12px; border-radius: 10px; font-size: 12px; display: grid; grid-template-columns: auto 90px 34px; gap: 4px 8px; align-items: center; }
  .panel input { width: 90px; }
  .hint { position: fixed; bottom: 10px; left: 12px; font-size: 12px; color: #999; }
</style>
</head>
<body>
<div class="panel">
  <span>중력</span><input type="range" id="g" min="0" max="3000" value="1200"><span id="gv"></span>
  <span>반발 계수</span><input type="range" id="e" min="0" max="100" value="75"><span id="ev"></span>
  <span>마찰</span><input type="range" id="f" min="0" max="100" value="12"><span id="fv"></span>
  <span>공기저항</span><input type="range" id="d" min="0" max="100" value="5"><span id="dv"></span>
</div>
<div class="hint">공을 잡아 던져 보세요 · 빈 곳 클릭 = 공 추가</div>
<canvas id="c"></canvas>
<script>
  const canvas = document.getElementById('c'), ctx = canvas.getContext('2d');
  let W, H; function resize() { W = canvas.width = innerWidth; H = canvas.height = innerHeight; } addEventListener('resize', resize); resize();
  const P = {}; ['g', 'e', 'f', 'd'].forEach(k => { const el = document.getElementById(k); const upd = () => { P[k] = +el.value; document.getElementById(k + 'v').textContent = k === 'g' ? el.value : (el.value / 100).toFixed(2); }; el.oninput = upd; upd(); });
  const colors = ['#ff6b6b', '#ffd93d', '#6bcb77', '#4d96ff', '#c77dff'];
  const balls = [];
  function add(x, y, vx = (Math.random() - .5) * 600, vy = 0) { const r = 12 + Math.random() * 16; balls.push({ x, y, vx, vy, r, m: r * r, c: colors[balls.length % 5], rot: 0 }); }
  for (let i = 0; i < 5; i++) add(80 + i * 70, 80 + i * 20);

  let drag = null, hist = [];
  canvas.addEventListener('pointerdown', e => {
    const b = balls.find(b => Math.hypot(b.x - e.clientX, b.y - e.clientY) < b.r + 6);
    if (b) { drag = b; hist = []; canvas.setPointerCapture(e.pointerId); canvas.style.cursor = 'grabbing'; } else add(e.clientX, e.clientY);
  });
  canvas.addEventListener('pointermove', e => { if (drag) { drag.x = e.clientX; drag.y = e.clientY; hist.push({ x: e.clientX, y: e.clientY, t: performance.now() }); if (hist.length > 5) hist.shift(); } });
  canvas.addEventListener('pointerup', () => {
    if (drag && hist.length > 1) { const a = hist[0], b = hist[hist.length - 1], dt = Math.max(16, b.t - a.t) / 1000; drag.vx = (b.x - a.x) / dt; drag.vy = (b.y - a.y) / dt; }
    drag = null; canvas.style.cursor = 'grab';
  });

  function update(dt) {
    const e = P.e / 100, fr = P.f / 100, drag2 = P.d / 100;
    for (const b of balls) {
      if (b === drag) { b.vx = b.vy = 0; continue; }
      b.vy += P.g * dt;                                  // 중력 가속도
      b.vx *= 1 - drag2 * dt * 2; b.vy *= 1 - drag2 * dt * 2;   // 공기저항
      b.x += b.vx * dt; b.y += b.vy * dt;
      if (b.y > H - b.r) {                               // 바닥: 반발 + 마찰
        b.y = H - b.r; b.vy = -b.vy * e; b.vx *= 1 - fr;
        if (Math.abs(b.vy) < 30) b.vy = 0;
        b.vx *= 1 - fr * dt * 3;                         // 구름 마찰
      }
      if (b.y < b.r) { b.y = b.r; b.vy = -b.vy * e; }
      if (b.x < b.r) { b.x = b.r; b.vx = -b.vx * e; } if (b.x > W - b.r) { b.x = W - b.r; b.vx = -b.vx * e; }
      b.rot += b.vx * dt / b.r;
    }
  }
  function draw() {
    ctx.fillStyle = '#1e1e2e'; ctx.fillRect(0, 0, W, H);
    for (const b of balls) {
      ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(b.rot);
      ctx.fillStyle = b.c; ctx.beginPath(); ctx.arc(0, 0, b.r, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = 'rgba(0,0,0,.35)'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(-b.r * .7, 0); ctx.lineTo(b.r * .7, 0); ctx.stroke();
      ctx.restore();
      // 속도 벡터
      ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(b.x, b.y); ctx.lineTo(b.x + b.vx * .05, b.y + b.vy * .05); ctx.stroke();
    }
  }
  let last = performance.now();
  (function loop(now) { const dt = Math.min(.033, (now - last) / 1000); last = now; update(dt); draw(); requestAnimationFrame(loop); })(last);
</script>
</body>
</html>
