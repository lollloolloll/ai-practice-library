<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>할 일 목록</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: #f4f5f7; margin: 0; padding: 16px; color: #222; }
  .wrap { max-width: 920px; margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .card { background: #fff; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,.1); padding: 16px; min-width: 0; }
  h1 { font-size: 20px; margin: 0 0 12px; } h2 { font-size: 13px; margin: 0 0 8px; color: #555; }
  form { display: flex; gap: 8px; margin-bottom: 12px; }
  input[type=text] { flex: 1; min-width: 0; padding: 8px 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
  button { padding: 8px 14px; border: 0; border-radius: 4px; background: #4a6cf7; color: #fff; cursor: pointer; font-size: 14px; }
  ul { list-style: none; padding: 0; margin: 0; }
  li { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid #eee; }
  li span { flex: 1; } li.done span { text-decoration: line-through; color: #999; }
  .del { background: none; color: #c33; padding: 4px 8px; }
  .loading { color: #888; font-size: 13px; padding: 10px 0; }
  .err { background: #fff1f0; color: #b42318; font-size: 13px; padding: 8px 10px; border-radius: 6px; margin-bottom: 8px; }
  .net { font: 11px/1.55 ui-monospace, monospace; background: #111827; color: #d1d5db; border-radius: 8px; padding: 8px 10px; height: 300px; overflow: auto; }
  .m { display: inline-block; width: 52px; font-weight: 700; } .GET { color: #60a5fa; } .POST { color: #34d399; } .PATCH { color: #fbbf24; } .DELETE { color: #f87171; }
  .s2 { color: #34d399; } .s4 { color: #f87171; }
  .body { color: #9ca3af; padding-left: 52px; word-break: break-all; }
  .endpoints { font: 11px/1.7 ui-monospace, monospace; color: #555; background: #f7f8fb; padding: 8px 10px; border-radius: 6px; margin-top: 10px; }
  @media (max-width: 720px) { .wrap { grid-template-columns: 1fr; } .net { height: 180px; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>할 일 목록</h1>
    <form id="form"><input type="text" id="input" placeholder="할 일을 입력하세요"><button>추가</button></form>
    <div id="err"></div>
    <ul id="list"><li class="loading">GET /api/todos 불러오는 중…</li></ul>
    <div class="endpoints">GET /api/todos · POST /api/todos<br>PATCH /api/todos/:id · DELETE /api/todos/:id</div>
  </div>
  <div class="card"><h2>네트워크 (Mock REST 서버 · 지연 300~700ms)</h2><div class="net" id="net"></div></div>
</div>
<script>
  // 폼 제출이 막힌 환경(sandbox iframe 등)에서도 동작하도록 submit 이벤트 대신 버튼 클릭·Enter를 직접 처리
  function bindSubmit(form, handler) {
    const run = (ev, submitter) => { ev.preventDefault(); handler({ target: form, submitter, preventDefault() {} }); };
    form.addEventListener('click', ev => { const b = ev.target.closest('button'); if (b && b.type === 'submit' && !b.disabled) run(ev, b); });
    form.addEventListener('keydown', ev => { if (ev.key === 'Enter' && !ev.isComposing && ev.target.matches('input:not([type=checkbox])')) { const b = form.querySelector('button:not([type=button])'); if (!b || !b.disabled) run(ev, b); } });
  }
  // ── 데모용 Mock 서버: fetch를 가로채 /api/* 를 메모리 DB로 처리 (실서버로 교체 시 이 블록만 제거) ──
  const db = { seq: 3, rows: [{ id: 1, title: '장보기', completed: false }, { id: 2, title: '운동하기', completed: true }, { id: 3, title: '보고서 작성', completed: false }] };
  const realFetch = window.fetch.bind(window);
  const json = (status, body) => new Response(body === null ? null : JSON.stringify(body), { status, headers: { 'Content-Type': 'application/json' } });
  window.fetch = async (url, opt = {}) => {
    if (!String(url).startsWith('/api/')) return realFetch(url, opt);
    await new Promise(r => setTimeout(r, 300 + Math.random() * 400));
    const method = (opt.method || 'GET').toUpperCase(), m = String(url).match(/^\/api\/todos(?:\/(\d+))?$/), body = opt.body ? JSON.parse(opt.body) : null;
    if (!m) return json(404, { error: 'Not Found' });
    const id = m[1] && +m[1], row = id && db.rows.find(r => r.id === id);
    if (method === 'GET' && !id) return json(200, { data: db.rows, total: db.rows.length });
    if (method === 'POST' && !id) { if (!body?.title?.trim()) return json(422, { error: 'title은 필수입니다', field: 'title' }); const r = { id: ++db.seq, title: body.title.trim(), completed: false }; db.rows.push(r); return json(201, { data: r }); }
    if (!row) return json(404, { error: `todo ${id} 없음` });
    if (method === 'PATCH') { Object.assign(row, body); return json(200, { data: row }); }
    if (method === 'DELETE') { db.rows = db.rows.filter(r => r !== row); return json(204, null); }
    return json(405, { error: 'Method Not Allowed' });
  };
  // ── API 클라이언트 ──
  const net = (html) => { const n = document.getElementById('net'); n.insertAdjacentHTML('beforeend', html); n.scrollTop = 1e9; };
  async function api(method, path, body) {
    const t0 = performance.now();
    net(`<div><span class="m ${method}">${method}</span>${path}</div>` + (body ? `<div class="body">→ ${JSON.stringify(body)}</div>` : ''));
    const res = await fetch(path, { method, headers: { 'Content-Type': 'application/json' }, body: body ? JSON.stringify(body) : undefined });
    const data = res.status === 204 ? null : await res.json();
    net(`<div class="body"><span class="${res.ok ? 's2' : 's4'}">← ${res.status}</span> ${Math.round(performance.now() - t0)}ms ${data ? JSON.stringify(data).slice(0, 90) : ''}</div>`);
    if (!res.ok) throw Object.assign(new Error(data?.error || res.statusText), { status: res.status });
    return data;
  }
  const showErr = e => { document.getElementById('err').innerHTML = e ? `<div class="err">⚠ ${e.status || ''} ${e.message}</div>` : ''; };
  let todos = [];
  function render() {
    const list = document.getElementById('list'); list.innerHTML = '';
    todos.forEach(t => {
      const li = document.createElement('li'); if (t.completed) li.className = 'done';
      li.innerHTML = '<input type="checkbox"' + (t.completed ? ' checked' : '') + '><span></span><button class="del">삭제</button>';
      li.querySelector('span').textContent = t.title;
      li.querySelector('input').onchange = async e => { e.target.disabled = true; try { const { data } = await api('PATCH', `/api/todos/${t.id}`, { completed: !t.completed }); Object.assign(t, data); showErr(); } catch (err) { showErr(err); } render(); };
      li.querySelector('.del').onclick = async () => { li.style.opacity = .4; try { await api('DELETE', `/api/todos/${t.id}`); todos = todos.filter(x => x !== t); showErr(); } catch (err) { showErr(err); } render(); };
      list.appendChild(li);
    });
  }
  async function load() { try { const { data } = await api('GET', '/api/todos'); todos = data; render(); } catch (e) { showErr(e); } }
  bindSubmit(document.getElementById('form'), async e => {
    e.preventDefault(); const i = document.getElementById('input'), btn = e.target.querySelector('button'); btn.disabled = true;
    try { const { data } = await api('POST', '/api/todos', { title: i.value }); todos.push(data); i.value = ''; showErr(); render(); } catch (err) { showErr(err); }   // 빈 값이면 422 응답
    btn.disabled = false;
  });
  load();
</script>
</body>
</html>
