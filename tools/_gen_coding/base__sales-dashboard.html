<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>매출 대시보드</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 20px 16px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: #f5f6fa; color: #222; }
  h1 { font-size: 22px; margin: 0 0 16px; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .kpi { background: #fff; padding: 16px; border-radius: 8px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .kpi .label { font-size: 13px; color: #777; }
  .kpi .value { font-size: 24px; font-weight: 700; margin-top: 4px; }
  .kpi .up { color: #2e9e5b; font-size: 12px; }
  .kpi .down { color: #d64545; font-size: 12px; }
  .panel { background: #fff; padding: 16px; border-radius: 8px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .panel h2 { font-size: 16px; margin: 0 0 12px; }
  .chart-wrap { position: relative; height: 260px; }
</style>
</head>
<body>
<h1>매출 대시보드</h1>
<div class="kpis">
  <div class="kpi"><div class="label">총 매출</div><div class="value">₩48,250,000</div><div class="up">▲ 12.5% 전월 대비</div></div>
  <div class="kpi"><div class="label">주문 수</div><div class="value">1,284</div><div class="up">▲ 8.1%</div></div>
  <div class="kpi"><div class="label">평균 주문 금액</div><div class="value">₩37,580</div><div class="up">▲ 4.0%</div></div>
  <div class="kpi"><div class="label">환불률</div><div class="value">2.3%</div><div class="down">▲ 0.4%p</div></div>
</div>
<div class="panel">
  <h2>월별 매출 추이</h2>
  <div class="chart-wrap"><canvas id="chart"></canvas></div>
</div>
<script>
  const months = ['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];
  const sales = [3200, 3500, 3100, 3900, 4200, 4000, 4500, 4700, 4300, 4900, 5200, 4825];
  new Chart(document.getElementById('chart'), {
    type: 'line',
    data: { labels: months, datasets: [{ label: '매출 (만원)', data: sales, borderColor: '#4a6cf7', backgroundColor: 'rgba(74,108,247,.1)', fill: true, tension: 0.3 }] },
    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
  });
</script>
</body>
</html>
