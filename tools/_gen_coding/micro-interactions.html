<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>할 일 목록</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: #f4f5f7; margin: 0; padding: 24px 16px; color: #222; }
  .app { max-width: 480px; margin: 0 auto; background: #fff; border-radius: 12px; box-shadow: 0 2px 10px rgba(0,0,0,.06); padding: 20px; }
  h1 { font-size: 22px; margin: 0 0 16px; }
  form { display: flex; gap: 8px; margin-bottom: 14px; }
  input[type=text] { flex: 1; min-width: 0; padding: 10px 12px; border: 1.5px solid #ddd; border-radius: 8px; font-size: 14px; transition: border-color .2s, box-shadow .2s; }
  input[type=text]:focus { outline: none; border-color: #4a6cf7; box-shadow: 0 0 0 4px rgba(74,108,247,.15); }
  form.shake { animation: shake .35s; }
  @keyframes shake { 20%,60% { transform: translateX(-6px); } 40%,80% { transform: translateX(6px); } }
  .add { padding: 0 16px; border: 0; border-radius: 8px; background: #4a6cf7; color: #fff; cursor: pointer; font-size: 14px; transition: transform .12s, box-shadow .2s, background .2s; }
  .add:hover { background: #3b5bea; box-shadow: 0 4px 12px rgba(74,108,247,.35); transform: translateY(-1px); }
  .add:active { transform: scale(.94); }
  ul { list-style: none; padding: 0; margin: 0; }
  li { display: flex; align-items: center; gap: 12px; padding: 10px 8px; border-radius: 8px; transition: background .15s, opacity .3s, transform .3s; }
  li:hover { background: #f6f7fb; }
  li.enter { animation: pop .35s cubic-bezier(.2,1.4,.4,1); }
  @keyframes pop { from { opacity: 0; transform: translateY(-8px) scale(.96); } }
  li.leave { opacity: 0; transform: translateX(40px); }
  li span { flex: 1; position: relative; transition: color .3s; }
  li span::after { content: ''; position: absolute; left: 0; top: 50%; height: 1.5px; width: 0; background: #aaa; transition: width .3s ease; }
  li.done span { color: #aaa; } li.done span::after { width: 100%; }
  .chk { width: 22px; height: 22px; border-radius: 50%; border: 2px solid #c5c9d6; background: #fff; cursor: pointer; display: grid; place-items: center; transition: all .2s; flex: none; padding: 0; }
  .chk:hover { border-color: #4a6cf7; transform: scale(1.1); }
  .chk svg { width: 12px; stroke: #fff; stroke-width: 3; fill: none; stroke-dasharray: 20; stroke-dashoffset: 20; transition: stroke-dashoffset .25s .05s; }
  li.done .chk { background: #2ecc71; border-color: #2ecc71; animation: bounce .35s; }
  li.done .chk svg { stroke-dashoffset: 0; }
  @keyframes bounce { 50% { transform: scale(1.25); } }
  .del { background: none; border: 0; color: #c33; cursor: pointer; opacity: 0; transform: translateX(6px); transition: opacity .2s, transform .2s; font-size: 16px; }
  li:hover .del, li:focus-within .del { opacity: 1; transform: none; }
  .count { margin-top: 12px; font-size: 13px; color: #666; }
  .count b { display: inline-block; transition: transform .2s; } .count b.bump { transform: scale(1.4); color: #4a6cf7; }
  @media (prefers-reduced-motion: reduce) { *, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="app">
  <h1>할 일 목록</h1>
  <form id="form"><input type="text" id="input" placeholder="할 일을 입력하세요 (빈 칸으로 추가해 보세요)"><button class="add">추가</button></form>
  <ul id="list"></ul>
  <div class="count">남은 할 일 <b id="left">0</b>개</div>
</div>
<script>
  // 폼 제출이 막힌 환경(sandbox iframe 등)에서도 동작하도록 submit 이벤트 대신 버튼 클릭·Enter를 직접 처리
  function bindSubmit(form, handler) {
    const run = (ev, submitter) => { ev.preventDefault(); handler({ target: form, submitter, preventDefault() {} }); };
    form.addEventListener('click', ev => { const b = ev.target.closest('button'); if (b && b.type === 'submit' && !b.disabled) run(ev, b); });
    form.addEventListener('keydown', ev => { if (ev.key === 'Enter' && !ev.isComposing && ev.target.matches('input:not([type=checkbox])')) { const b = form.querySelector('button:not([type=button])'); if (!b || !b.disabled) run(ev, b); } });
  }
  let todos = [{ id: 1, text: '장보기', done: false }, { id: 2, text: '운동하기', done: true }, { id: 3, text: '보고서 작성', done: false }];
  const list = document.getElementById('list');
  const check = '<svg viewBox="0 0 14 14"><path d="M2 7.5l3 3 7-7"/></svg>';
  function item(t, isNew) {
    const li = document.createElement('li'); if (t.done) li.classList.add('done'); if (isNew) li.classList.add('enter');
    li.innerHTML = `<button class="chk" aria-label="완료">${check}</button><span></span><button class="del" aria-label="삭제">✕</button>`;
    li.querySelector('span').textContent = t.text;
    li.querySelector('.chk').onclick = () => { t.done = !t.done; li.classList.toggle('done', t.done); updateCount(); };
    li.querySelector('.del').onclick = () => { li.classList.add('leave'); setTimeout(() => { todos = todos.filter(x => x !== t); li.remove(); updateCount(); }, 280); };
    return li;
  }
  function updateCount() {
    const b = document.getElementById('left'); b.textContent = todos.filter(t => !t.done).length;
    b.classList.add('bump'); setTimeout(() => b.classList.remove('bump'), 180);
  }
  todos.forEach(t => list.appendChild(item(t)));
  updateCount();
  bindSubmit(document.getElementById('form'), e => {
    e.preventDefault(); const f = e.target, i = document.getElementById('input'), v = i.value.trim();
    if (!v) { f.classList.remove('shake'); void f.offsetWidth; f.classList.add('shake'); return; }
    const t = { id: Date.now(), text: v, done: false }; todos.push(t); list.appendChild(item(t, true)); i.value = ''; updateCount();
  });
</script>
</body>
</html>
