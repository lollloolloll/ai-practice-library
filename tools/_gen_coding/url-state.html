<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>할 일 목록</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: #f4f5f7; margin: 0; padding: 16px; color: #222; }
  .url { max-width: 520px; margin: 0 auto 10px; display: flex; align-items: center; gap: 6px; background: #fff; border: 1px solid #ddd; border-radius: 999px; padding: 6px 12px; font: 12px ui-monospace, monospace; color: #555; overflow: hidden; }
  .url .q { color: #4a6cf7; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .url button { margin-left: auto; font: 11px system-ui; padding: 3px 8px; border: 0; border-radius: 999px; background: #eef1ff; color: #3b4fd8; cursor: pointer; flex: none; }
  .app { max-width: 520px; margin: 0 auto; background: #fff; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,.1); padding: 18px; }
  h1 { font-size: 22px; margin: 0 0 12px; }
  .bar { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
  input[type=text], select { padding: 7px 9px; border: 1px solid #ccc; border-radius: 6px; font-size: 13px; }
  #q { flex: 1; min-width: 120px; }
  .seg { display: flex; border: 1px solid #ccc; border-radius: 6px; overflow: hidden; }
  .seg button { border: 0; background: #fff; padding: 6px 10px; font-size: 12px; cursor: pointer; } .seg button.on { background: #4a6cf7; color: #fff; }
  ul { list-style: none; padding: 0; margin: 0; }
  li { display: flex; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid #eee; font-size: 14px; }
  li span { flex: 1; } li.done span { text-decoration: line-through; color: #999; }
  .tag { font-size: 11px; background: #f1f1f4; padding: 1px 7px; border-radius: 999px; color: #555; }
  .pages { display: flex; gap: 4px; margin-top: 10px; } .pages button { border: 1px solid #ddd; background: #fff; border-radius: 4px; padding: 3px 9px; cursor: pointer; } .pages button.on { background: #4a6cf7; color: #fff; border-color: #4a6cf7; }
  .hint { font-size: 12px; color: #888; margin-top: 10px; }
  .presets { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 6px; } .presets a { font: 11px ui-monospace, monospace; color: #4a6cf7; background: #eef1ff; padding: 2px 6px; border-radius: 4px; text-decoration: none; }
</style>
</head>
<body>
<div class="url"><span>🔒 todo.app/</span><span class="q" id="url"></span><button id="copy">링크 복사</button></div>
<div class="app">
  <h1>할 일 목록</h1>
  <div class="bar">
    <input type="text" id="q" placeholder="검색">
    <div class="seg" id="f"><button data-v="all">전체</button><button data-v="active">진행</button><button data-v="done">완료</button></div>
    <select id="tag"><option value="">모든 태그</option><option>업무</option><option>개인</option><option>건강</option></select>
    <select id="sort"><option value="new">최신순</option><option value="name">이름순</option></select>
  </div>
  <ul id="list"></ul>
  <div class="pages" id="pages"></div>
  <div class="hint">필터·검색·정렬·페이지가 URL 쿼리에 저장됩니다. 링크를 공유하면 같은 화면이 열리고, 뒤로가기도 동작합니다. 예시 링크:</div>
  <div class="presets"><a href="?filter=active&tag=업무">?filter=active&amp;tag=업무</a><a href="?q=보고&sort=name">?q=보고&amp;sort=name</a><a href="?filter=done&page=2">?filter=done&amp;page=2</a></div>
</div>
<script>
  const todos = [['장보기', '개인', 0], ['운동하기', '건강', 1], ['보고서 작성', '업무', 0], ['분기 보고서 검토', '업무', 0], ['이메일 답장', '업무', 1], ['치과 예약', '건강', 0], ['책 반납', '개인', 1], ['회의록 정리', '업무', 1], ['요가 수업', '건강', 0], ['세탁소', '개인', 0], ['예산안 보고', '업무', 0], ['비타민 사기', '건강', 1]].map(([text, tag, d], i) => ({ id: i + 1, text, tag, done: !!d }));
  const DEFAULTS = { q: '', filter: 'all', tag: '', sort: 'new', page: '1' }, PER = 5;
  // URL ↔ 상태: 기본값과 같은 키는 URL에서 생략해 짧게 유지
  let virtualSearch = location.search;              // srcdoc/샌드박스에서 history가 막힐 때 대비
  const readURL = () => ({ ...DEFAULTS, ...Object.fromEntries(new URLSearchParams(virtualSearch)) });
  function writeURL(state, push) {
    const p = new URLSearchParams(); for (const k in state) if (state[k] !== DEFAULTS[k]) p.set(k, state[k]);
    virtualSearch = p.toString() ? '?' + p : '';
    try { history[push ? 'pushState' : 'replaceState'](state, '', location.pathname + virtualSearch); } catch (e) { /* about:srcdoc 등 */ }
  }
  let state = readURL();
  function set(patch, push = true) { state = { ...state, ...patch }; if (!('page' in patch)) state.page = '1'; writeURL(state, push); render(); }
  addEventListener('popstate', e => { virtualSearch = location.search; state = readURL(); render(); });
  function render() {
    document.getElementById('url').textContent = virtualSearch ? decodeURIComponent(virtualSearch) : '(기본 상태)';
    document.getElementById('q').value = state.q; document.getElementById('tag').value = state.tag; document.getElementById('sort').value = state.sort;
    document.querySelectorAll('#f button').forEach(b => b.classList.toggle('on', b.dataset.v === state.filter));
    let rows = todos.filter(t => (state.filter === 'all' || (state.filter === 'done') === t.done) && (!state.tag || t.tag === state.tag) && t.text.includes(state.q));
    rows.sort(state.sort === 'name' ? (a, b) => a.text.localeCompare(b.text, 'ko') : (a, b) => b.id - a.id);
    const pages = Math.max(1, Math.ceil(rows.length / PER)), page = Math.min(+state.page || 1, pages);
    document.getElementById('list').innerHTML = rows.slice((page - 1) * PER, page * PER).map(t => `<li class="${t.done ? 'done' : ''}"><input type="checkbox" ${t.done ? 'checked' : ''} data-id="${t.id}"><span>${t.text}</span><span class="tag">${t.tag}</span></li>`).join('') || '<li style="color:#999">결과 없음</li>';
    document.getElementById('pages').innerHTML = Array.from({ length: pages }, (_, i) => `<button class="${i + 1 === page ? 'on' : ''}" data-p="${i + 1}">${i + 1}</button>`).join('');
  }
  let qTimer; document.getElementById('q').oninput = e => { clearTimeout(qTimer); qTimer = setTimeout(() => set({ q: e.target.value }, false), 250); };  // 타이핑은 replaceState
  document.getElementById('f').onclick = e => e.target.dataset.v && set({ filter: e.target.dataset.v });
  document.getElementById('tag').onchange = e => set({ tag: e.target.value });
  document.getElementById('sort').onchange = e => set({ sort: e.target.value });
  document.getElementById('pages').onclick = e => e.target.dataset.p && set({ page: e.target.dataset.p });
  document.getElementById('list').onchange = e => { const t = todos.find(x => x.id === +e.target.dataset.id); t.done = e.target.checked; render(); };
  document.querySelector('.presets').onclick = e => { if (e.target.tagName !== 'A') return; e.preventDefault(); virtualSearch = e.target.getAttribute('href'); state = readURL(); writeURL(state, true); render(); };
  document.getElementById('copy').onclick = async e => { const link = 'https://todo.app/' + virtualSearch; try { await navigator.clipboard.writeText(link); e.target.textContent = '복사됨 ✓'; } catch (err) { e.target.textContent = '복사 불가'; } setTimeout(() => e.target.textContent = '링크 복사', 1200); };
  render();
</script>
</body>
</html>
