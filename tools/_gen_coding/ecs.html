<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>튀는 공 — ECS</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1e1e2e; font-family: system-ui, sans-serif; color: #ddd; }
  canvas { display: block; }
  .panel { position: fixed; top: 8px; left: 8px; background: rgba(0,0,0,.55); padding: 8px 10px; border-radius: 8px; font: 11px/1.6 ui-monospace, monospace; max-width: 260px; }
  .panel button { font: 11px system-ui; margin: 2px 2px 0 0; padding: 4px 7px; border-radius: 5px; border: 1px solid #555; background: #2a2a40; color: #ddd; cursor: pointer; }
  .panel .sys span { display: inline-block; margin-right: 6px; } .panel .sys input { vertical-align: -2px; }
</style>
</head>
<body>
<div class="panel">
  <div><b>Entities</b> <span id="ec"></span></div>
  <div id="cc"></div>
  <div style="margin-top:4px"><b>Systems</b></div>
  <div class="sys" id="sys"></div>
  <div style="margin-top:4px"><b>Spawn</b><br>
    <button data-p="basic">공(기본)</button><button data-p="heavy">중력 공</button><button data-p="comet">혜성(꼬리)</button><button data-p="blinker">깜빡이(수명)</button>
  </div>
</div>
<canvas id="c"></canvas>
<script>
  const canvas = document.getElementById('c'), ctx = canvas.getContext('2d');
  let W, H; function resize() { W = canvas.width = innerWidth; H = canvas.height = innerHeight; } addEventListener('resize', resize); resize();

  // ── World: 엔티티 = id, 컴포넌트 = 이름별 Map(id → data), 시스템 = 특정 컴포넌트 조합을 가진 엔티티만 처리 ──
  const world = { next: 1, comps: { Position: new Map(), Velocity: new Map(), Circle: new Map(), Gravity: new Map(), Bounce: new Map(), Trail: new Map(), Lifetime: new Map(), Pulse: new Map() } };
  const create = c => { const id = world.next++; for (const k in c) world.comps[k].set(id, c[k]); return id; };
  const destroy = id => { for (const k in world.comps) world.comps[k].delete(id); };
  const query = (...names) => { const [first, ...rest] = names.map(n => world.comps[n]).sort((a, b) => a.size - b.size); return [...first.keys()].filter(id => rest.every(m => m.has(id))); };
  const get = (n, id) => world.comps[n].get(id);

  const systems = [
    { name: 'Gravity', on: true, run: dt => query('Velocity', 'Gravity').forEach(id => get('Velocity', id).y += get('Gravity', id).g * dt) },
    { name: 'Movement', on: true, run: dt => query('Position', 'Velocity').forEach(id => { const p = get('Position', id), v = get('Velocity', id); p.x += v.x * dt; p.y += v.y * dt; }) },
    { name: 'Bounce', on: true, run: () => query('Position', 'Velocity', 'Circle', 'Bounce').forEach(id => {
        const p = get('Position', id), v = get('Velocity', id), r = get('Circle', id).r, e = get('Bounce', id).e;
        if (p.x < r || p.x > W - r) { v.x *= -1; p.x = Math.max(r, Math.min(W - r, p.x)); }
        if (p.y < r) { v.y = Math.abs(v.y); p.y = r; } if (p.y > H - r) { v.y = -Math.abs(v.y) * e; p.y = H - r; if (Math.abs(v.y) < 80) v.y = -600; }
      }) },
    { name: 'Trail', on: true, run: () => query('Position', 'Trail').forEach(id => { const t = get('Trail', id).pts, p = get('Position', id); t.push({ x: p.x, y: p.y }); if (t.length > 20) t.shift(); }) },
    { name: 'Pulse', on: true, run: dt => query('Circle', 'Pulse').forEach(id => { const pu = get('Pulse', id); pu.t += dt; get('Circle', id).r = pu.base * (1 + .3 * Math.sin(pu.t * 8)); }) },
    { name: 'Lifetime', on: true, run: dt => query('Lifetime').forEach(id => { const l = get('Lifetime', id); l.t -= dt; if (l.t <= 0) destroy(id); }) },
  ];
  function render() {
    ctx.fillStyle = '#1e1e2e'; ctx.fillRect(0, 0, W, H);
    query('Trail', 'Circle').forEach(id => { const pts = get('Trail', id).pts, c = get('Circle', id); pts.forEach((q, i) => { ctx.globalAlpha = i / pts.length * .5; ctx.fillStyle = c.color; ctx.beginPath(); ctx.arc(q.x, q.y, c.r * i / pts.length, 0, 7); ctx.fill(); }); });
    ctx.globalAlpha = 1;
    query('Position', 'Circle').forEach(id => { const p = get('Position', id), c = get('Circle', id), l = get('Lifetime', id); ctx.globalAlpha = l ? Math.min(1, l.t) : 1; ctx.fillStyle = c.color; ctx.beginPath(); ctx.arc(p.x, p.y, c.r, 0, 7); ctx.fill(); });
    ctx.globalAlpha = 1;
  }
  // 프리팹 = 컴포넌트 조합
  const rv = () => (Math.random() - .5) * 400;
  const prefabs = {
    basic: (x, y) => create({ Position: { x, y }, Velocity: { x: rv(), y: rv() }, Circle: { r: 14, color: '#4d96ff' }, Bounce: { e: 1 } }),
    heavy: (x, y) => create({ Position: { x, y }, Velocity: { x: rv(), y: 0 }, Circle: { r: 20, color: '#ff6b6b' }, Bounce: { e: .8 }, Gravity: { g: 1200 } }),
    comet: (x, y) => create({ Position: { x, y }, Velocity: { x: rv() * 1.5, y: rv() * 1.5 }, Circle: { r: 9, color: '#ffd93d' }, Bounce: { e: 1 }, Trail: { pts: [] } }),
    blinker: (x, y) => create({ Position: { x, y }, Velocity: { x: rv(), y: rv() }, Circle: { r: 12, color: '#c77dff' }, Bounce: { e: 1 }, Pulse: { t: 0, base: 12 }, Lifetime: { t: 4 } }),
  };
  Object.values(prefabs).forEach(f => { f(W * Math.random(), H * .4); f(W * Math.random(), H * .4); });
  document.querySelectorAll('[data-p]').forEach(b => b.onclick = () => { for (let i = 0; i < 3; i++) prefabs[b.dataset.p](40 + Math.random() * (W - 80), 60 + Math.random() * (H / 2)); });
  canvas.addEventListener('click', e => { const ks = Object.keys(prefabs); prefabs[ks[Math.floor(Math.random() * ks.length)]](e.clientX, e.clientY); });
  document.getElementById('sys').innerHTML = systems.map((s, i) => `<span><input type="checkbox" checked data-s="${i}">${s.name}</span>`).join('');
  document.getElementById('sys').onchange = e => systems[e.target.dataset.s].on = e.target.checked;
  let last = performance.now();
  function loop(now) {
    const dt = Math.min(.033, (now - last) / 1000); last = now;
    for (const s of systems) if (s.on) s.run(dt);
    render();
    document.getElementById('ec').textContent = world.comps.Position.size;
    document.getElementById('cc').textContent = Object.entries(world.comps).map(([k, m]) => `${k}:${m.size}`).join(' ');
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
</script>
</body>
</html>
