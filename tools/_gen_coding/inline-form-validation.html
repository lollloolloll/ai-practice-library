<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>빈하우스 커피 구독</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: #333; line-height: 1.5; background: #f7f1eb; }
  header { padding: 16px 24px; background: #fff; border-bottom: 1px solid #eee; font-weight: 700; font-size: 20px; color: #6f4e37; }
  .wrap { display: grid; grid-template-columns: 1fr 1fr; gap: 32px; max-width: 960px; margin: 0 auto; padding: 40px 20px; align-items: center; }
  h1 { font-size: clamp(26px, 4.5vw, 36px); color: #3e2723; margin: 0 0 12px; }
  .lead { color: #666; }
  ul.perks { padding-left: 18px; color: #5d4037; }
  form { background: #fff; padding: 24px; border-radius: 14px; box-shadow: 0 8px 30px rgba(62,39,35,.08); }
  form h2 { margin: 0 0 14px; font-size: 18px; color: #3e2723; }
  .f { margin-bottom: 12px; }
  label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 4px; }
  .in { position: relative; }
  input, select { width: 100%; padding: 10px 34px 10px 12px; border: 1.5px solid #d7ccc8; border-radius: 8px; font-size: 15px; transition: border-color .2s, box-shadow .2s; }
  input:focus, select:focus { outline: none; border-color: #6f4e37; box-shadow: 0 0 0 3px rgba(111,78,55,.15); }
  .f.ok input { border-color: #2e9e5b; } .f.bad input { border-color: #d64545; background: #fff8f8; }
  .in::after { position: absolute; right: 12px; top: 10px; font-size: 14px; }
  .f.ok .in::after { content: '✓'; color: #2e9e5b; } .f.bad .in::after { content: '!'; color: #d64545; font-weight: 700; }
  .msg { font-size: 12px; min-height: 17px; margin-top: 3px; color: #888; }
  .f.bad .msg { color: #d64545; } .f.ok .msg { color: #2e9e5b; }
  .meter { height: 4px; background: #eee; border-radius: 2px; margin-top: 6px; overflow: hidden; }
  .meter i { display: block; height: 100%; width: 0; transition: width .3s, background .3s; }
  button { width: 100%; padding: 13px; border: 0; border-radius: 8px; background: #6f4e37; color: #fff; font-size: 16px; cursor: pointer; transition: opacity .2s; }
  button:disabled { opacity: .4; cursor: not-allowed; }
  .success { text-align: center; padding: 30px 10px; }
  @media (max-width: 700px) { .wrap { grid-template-columns: 1fr; padding-top: 24px; } }
</style>
</head>
<body>
<header>☕ 빈하우스</header>
<div class="wrap">
  <div>
    <h1>매주 신선한 원두를 문 앞까지</h1>
    <p class="lead">로스팅 후 48시간 안에 배송되는 스페셜티 커피 구독 서비스</p>
    <ul class="perks"><li>첫 달 50% 할인</li><li>무료 배송</li><li>언제든 해지</li></ul>
  </div>
  <form id="form" novalidate>
    <h2>구독 시작하기</h2>
    <div class="f" data-k="name"><label for="name">이름</label><div class="in"><input id="name" autocomplete="name"></div><div class="msg"></div></div>
    <div class="f" data-k="email"><label for="email">이메일</label><div class="in"><input id="email" type="email" autocomplete="email" placeholder="you@example.com"></div><div class="msg"></div></div>
    <div class="f" data-k="phone"><label for="phone">휴대폰 번호</label><div class="in"><input id="phone" inputmode="numeric" placeholder="010-0000-0000"></div><div class="msg"></div></div>
    <div class="f" data-k="pw"><label for="pw">비밀번호</label><div class="in"><input id="pw" type="password" autocomplete="new-password"></div><div class="meter"><i id="bar"></i></div><div class="msg"></div></div>
    <button id="submit" disabled>구독 신청</button>
  </form>
</div>
<script>
  // 폼 제출이 막힌 환경(sandbox iframe 등)에서도 동작하도록 submit 이벤트 대신 버튼 클릭·Enter를 직접 처리
  function bindSubmit(form, handler) {
    const run = (ev, submitter) => { ev.preventDefault(); handler({ target: form, submitter, preventDefault() {} }); };
    form.addEventListener('click', ev => { const b = ev.target.closest('button'); if (b && b.type === 'submit' && !b.disabled) run(ev, b); });
    form.addEventListener('keydown', ev => { if (ev.key === 'Enter' && !ev.isComposing && ev.target.matches('input:not([type=checkbox])')) { const b = form.querySelector('button:not([type=button])'); if (!b || !b.disabled) run(ev, b); } });
  }
  const rules = {
    name: v => v.trim().length >= 2 ? '' : '이름을 2자 이상 입력해 주세요',
    email: v => /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v) ? '' : '올바른 이메일 형식이 아니에요 (예: you@example.com)',
    phone: v => /^01[016789]-\d{3,4}-\d{4}$/.test(v) ? '' : '010-1234-5678 형식으로 입력해 주세요',
    pw: v => v.length < 8 ? '8자 이상 입력해 주세요' : !/\d/.test(v) || !/[a-zA-Z]/.test(v) ? '영문과 숫자를 함께 사용해 주세요' : ''
  };
  const okMsg = { name: '좋아요!', email: '사용 가능한 이메일이에요', phone: '확인되었습니다', pw: '안전한 비밀번호예요' };
  const touched = {};
  function check(k) {
    const f = document.querySelector(`[data-k="${k}"]`), v = f.querySelector('input').value, err = rules[k](v);
    if (touched[k]) { f.classList.toggle('bad', !!err); f.classList.toggle('ok', !err); f.querySelector('.msg').textContent = err || okMsg[k]; f.querySelector('input').setAttribute('aria-invalid', !!err); }
    return !err;
  }
  function all() { document.getElementById('submit').disabled = !Object.keys(rules).map(k => rules[k](document.getElementById(k).value) === '').every(Boolean); }
  Object.keys(rules).forEach(k => {
    const el = document.getElementById(k);
    el.addEventListener('blur', () => { if (el.value) touched[k] = true; check(k); });
    el.addEventListener('input', () => {
      if (k === 'phone') { const d = el.value.replace(/\D/g, '').slice(0, 11); el.value = d.length > 7 ? `${d.slice(0, 3)}-${d.slice(3, d.length - 4)}-${d.slice(-4)}` : d.length > 3 ? `${d.slice(0, 3)}-${d.slice(3)}` : d; }
      if (k === 'pw') { const s = [el.value.length >= 8, /\d/.test(el.value), /[a-zA-Z]/.test(el.value), /[^\w]/.test(el.value)].filter(Boolean).length; const b = document.getElementById('bar'); b.style.width = s * 25 + '%'; b.style.background = ['#eee', '#d64545', '#f0a020', '#8bc34a', '#2e9e5b'][s]; }
      if (touched[k] || rules[k](el.value) === '') { touched[k] = true; } check(k); all();
    });
  });
  bindSubmit(document.getElementById('form'), e => {
    e.preventDefault(); Object.keys(rules).forEach(k => { touched[k] = true; check(k); });
    if (Object.keys(rules).every(check)) e.target.innerHTML = '<div class="success"><div style="font-size:44px">✅</div><h2>신청 완료!</h2><p>확인 메일을 보내드렸어요.</p></div>';
  });
</script>
</body>
</html>
