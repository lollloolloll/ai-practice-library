<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>할 일 목록</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: #f4f5f7; margin: 0; padding: 24px 16px; color: #222; }
  .app { max-width: 480px; margin: 0 auto; background: #fff; border-radius: 10px; box-shadow: 0 1px 4px rgba(0,0,0,.1); padding: 20px; }
  h1 { font-size: 22px; margin: 0 0 16px; }
  form { display: flex; gap: 8px; margin-bottom: 16px; }
  input[type=text] { flex: 1; min-width: 0; padding: 9px 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
  button { padding: 8px 14px; border: 0; border-radius: 6px; background: #4a6cf7; color: #fff; cursor: pointer; font-size: 14px; }
  ul { list-style: none; padding: 0; margin: 0; }
  li { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid #eee; }
  li span { flex: 1; } li.done span { text-decoration: line-through; color: #999; }
  .del { background: none; color: #c33; padding: 4px 8px; }
  .empty { text-align: center; padding: 28px 12px 12px; animation: fade .4s; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } }
  .empty svg { width: 120px; height: 100px; }
  .empty h2 { font-size: 17px; margin: 10px 0 6px; }
  .empty p { font-size: 14px; color: #6b7280; margin: 0 0 16px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
  .chip { background: #eef1ff; color: #3b4fd8; border-radius: 999px; padding: 6px 12px; font-size: 13px; }
  .count { margin-top: 12px; font-size: 13px; color: #666; }
  .clear { background: none; color: #888; font-size: 12px; padding: 4px; text-decoration: underline; }
</style>
</head>
<body>
<div class="app">
  <h1>할 일 목록</h1>
  <form id="form"><input type="text" id="input" placeholder="할 일을 입력하세요"><button>추가</button></form>
  <ul id="list"></ul>
  <div id="empty"></div>
  <div class="count" id="count"></div>
</div>
<script>
  // 폼 제출이 막힌 환경(sandbox iframe 등)에서도 동작하도록 submit 이벤트 대신 버튼 클릭·Enter를 직접 처리
  function bindSubmit(form, handler) {
    const run = (ev, submitter) => { ev.preventDefault(); handler({ target: form, submitter, preventDefault() {} }); };
    form.addEventListener('click', ev => { const b = ev.target.closest('button'); if (b && b.type === 'submit' && !b.disabled) run(ev, b); });
    form.addEventListener('keydown', ev => { if (ev.key === 'Enter' && !ev.isComposing && ev.target.matches('input:not([type=checkbox])')) { const b = form.querySelector('button:not([type=button])'); if (!b || !b.disabled) run(ev, b); } });
  }
  let todos = [];
  const list = document.getElementById('list'), empty = document.getElementById('empty');
  const art = `<svg viewBox="0 0 120 100" aria-hidden="true"><rect x="22" y="14" width="76" height="78" rx="10" fill="#eef1ff"/><rect x="34" y="30" width="40" height="6" rx="3" fill="#c7d0ff"/><rect x="34" y="46" width="52" height="6" rx="3" fill="#c7d0ff"/><rect x="34" y="62" width="30" height="6" rx="3" fill="#c7d0ff"/><circle cx="92" cy="22" r="14" fill="#4a6cf7"/><path d="M85 22l5 5 9-9" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round"/></svg>`;
  const ideas = ['물 2L 마시기', '30분 산책', '책 10쪽 읽기'];
  function render() {
    list.innerHTML = '';
    todos.forEach(t => {
      const li = document.createElement('li'); if (t.done) li.className = 'done';
      li.innerHTML = '<input type="checkbox"' + (t.done ? ' checked' : '') + '><span></span><button class="del">삭제</button>';
      li.querySelector('span').textContent = t.text;
      li.querySelector('input').onchange = () => { t.done = !t.done; render(); };
      li.querySelector('.del').onclick = () => { todos = todos.filter(x => x !== t); render(); };
      list.appendChild(li);
    });
    const allDone = todos.length && todos.every(t => t.done);
    if (!todos.length) {
      empty.innerHTML = `<div class="empty">${art}<h2>아직 할 일이 없어요</h2><p>오늘 해야 할 일을 하나 추가해 보세요.<br>작은 일부터 시작하면 좋아요.</p><div class="chips">${ideas.map(x => `<button class="chip">+ ${x}</button>`).join('')}</div></div>`;
      empty.querySelectorAll('.chip').forEach((c, i) => c.onclick = () => { todos.push({ text: ideas[i], done: false }); render(); });
    } else if (allDone) {
      empty.innerHTML = `<div class="empty"><div style="font-size:44px">🎉</div><h2>모두 끝냈어요!</h2><p>오늘 할 일을 전부 완료했습니다.</p><button class="clear" id="clr">완료 항목 비우기</button></div>`;
      document.getElementById('clr').onclick = () => { todos = []; render(); };
    } else empty.innerHTML = '';
    document.getElementById('count').textContent = todos.length ? `남은 할 일 ${todos.filter(t => !t.done).length}개 / 전체 ${todos.length}개` : '';
  }
  bindSubmit(document.getElementById('form'), e => { e.preventDefault(); const i = document.getElementById('input'); const v = i.value.trim(); if (!v) return; todos.push({ text: v, done: false }); i.value = ''; render(); });
  render();
</script>
</body>
</html>
