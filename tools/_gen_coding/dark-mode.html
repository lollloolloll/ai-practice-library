<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>할 일 목록</title>
<style>
  :root { --bg:#f4f5f7; --card:#fff; --text:#1f2328; --muted:#6b7280; --line:#e5e7eb; --accent:#4a6cf7; --input:#fff; }
  [data-theme="dark"] { --bg:#0f1117; --card:#1a1d27; --text:#e6e8ee; --muted:#9aa0ae; --line:#2a2f3d; --accent:#7c94ff; --input:#12141c; }
  * { box-sizing: border-box; }
  body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 24px 16px; transition: background .3s, color .3s; }
  .app { max-width: 480px; margin: 0 auto; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 20px; transition: background .3s, border-color .3s; }
  .top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  h1 { font-size: 22px; margin: 0; }
  .theme { background: var(--input); color: var(--text); border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; cursor: pointer; font-size: 13px; }
  form { display: flex; gap: 8px; margin-bottom: 16px; }
  input[type=text] { flex: 1; min-width: 0; padding: 9px 10px; border: 1px solid var(--line); border-radius: 6px; font-size: 14px; background: var(--input); color: var(--text); }
  .add { padding: 8px 14px; border: 0; border-radius: 6px; background: var(--accent); color: #fff; cursor: pointer; }
  ul { list-style: none; padding: 0; margin: 0; }
  li { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
  li span { flex: 1; }
  li.done span { text-decoration: line-through; color: var(--muted); }
  .del { background: none; border: 0; color: #e5534b; cursor: pointer; }
  .count { margin-top: 12px; font-size: 13px; color: var(--muted); }
  input[type=checkbox] { accent-color: var(--accent); }
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <h1>할 일 목록</h1>
    <button class="theme" id="theme" aria-label="테마 전환"></button>
  </div>
  <form id="form"><input type="text" id="input" placeholder="할 일을 입력하세요"><button class="add">추가</button></form>
  <ul id="list"></ul>
  <div class="count" id="count"></div>
</div>
<script>
  // 폼 제출이 막힌 환경(sandbox iframe 등)에서도 동작하도록 submit 이벤트 대신 버튼 클릭·Enter를 직접 처리
  function bindSubmit(form, handler) {
    const run = (ev, submitter) => { ev.preventDefault(); handler({ target: form, submitter, preventDefault() {} }); };
    form.addEventListener('click', ev => { const b = ev.target.closest('button'); if (b && b.type === 'submit' && !b.disabled) run(ev, b); });
    form.addEventListener('keydown', ev => { if (ev.key === 'Enter' && !ev.isComposing && ev.target.matches('input:not([type=checkbox])')) { const b = form.querySelector('button:not([type=button])'); if (!b || !b.disabled) run(ev, b); } });
  }
  // 테마: 저장값 → 시스템 설정 순으로 결정
  const root = document.documentElement, btn = document.getElementById('theme');
  let saved = null; try { saved = localStorage.getItem('theme'); } catch (e) {}
  let theme = saved || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  function applyTheme() {
    root.dataset.theme = theme;
    btn.textContent = theme === 'dark' ? '☀️ 라이트 모드' : '🌙 다크 모드';
  }
  btn.onclick = () => { theme = theme === 'dark' ? 'light' : 'dark'; try { localStorage.setItem('theme', theme); } catch (e) {} applyTheme(); };
  applyTheme();

  let todos = [{ text: '장보기', done: false }, { text: '운동하기', done: true }, { text: '보고서 작성', done: false }];
  const list = document.getElementById('list');
  function render() {
    list.innerHTML = '';
    todos.forEach(t => {
      const li = document.createElement('li'); if (t.done) li.className = 'done';
      li.innerHTML = '<input type="checkbox"' + (t.done ? ' checked' : '') + '><span></span><button class="del">삭제</button>';
      li.querySelector('span').textContent = t.text;
      li.querySelector('input').onchange = () => { t.done = !t.done; render(); };
      li.querySelector('.del').onclick = () => { todos = todos.filter(x => x !== t); render(); };
      list.appendChild(li);
    });
    document.getElementById('count').textContent = `남은 할 일 ${todos.filter(t => !t.done).length}개 / 전체 ${todos.length}개`;
  }
  bindSubmit(document.getElementById('form'), e => { e.preventDefault(); const i = document.getElementById('input'); const v = i.value.trim(); if (!v) return; todos.push({ text: v, done: false }); i.value = ''; render(); });
  render();
</script>
</body>
</html>
