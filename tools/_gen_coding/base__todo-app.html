<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>할 일 목록</title>
<style>
  body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: #f4f5f7; margin: 0; padding: 24px 16px; color: #222; }
  .app { max-width: 480px; margin: 0 auto; background: #fff; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,.1); padding: 20px; }
  h1 { font-size: 22px; margin: 0 0 16px; }
  form { display: flex; gap: 8px; margin-bottom: 16px; }
  input[type=text] { flex: 1; min-width: 0; padding: 8px 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
  button { padding: 8px 14px; border: 0; border-radius: 4px; background: #4a6cf7; color: #fff; cursor: pointer; font-size: 14px; }
  ul { list-style: none; padding: 0; margin: 0; }
  li { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid #eee; }
  li span { flex: 1; }
  li.done span { text-decoration: line-through; color: #999; }
  .del { background: none; color: #c33; padding: 4px 8px; }
  .count { margin-top: 12px; font-size: 13px; color: #666; }
</style>
</head>
<body>
<div class="app">
  <h1>할 일 목록</h1>
  <form id="form">
    <input type="text" id="input" placeholder="할 일을 입력하세요">
    <button type="submit">추가</button>
  </form>
  <ul id="list"></ul>
  <div class="count" id="count"></div>
</div>
<script>
  // 폼 제출이 막힌 환경(sandbox iframe 등)에서도 동작하도록 submit 이벤트 대신 버튼 클릭·Enter를 직접 처리
  function bindSubmit(form, handler) {
    const run = (ev, submitter) => { ev.preventDefault(); handler({ target: form, submitter, preventDefault() {} }); };
    form.addEventListener('click', ev => { const b = ev.target.closest('button'); if (b && b.type === 'submit' && !b.disabled) run(ev, b); });
    form.addEventListener('keydown', ev => { if (ev.key === 'Enter' && !ev.isComposing && ev.target.matches('input:not([type=checkbox])')) { const b = form.querySelector('button:not([type=button])'); if (!b || !b.disabled) run(ev, b); } });
  }
  let todos = [
    { id: 1, text: '장보기', done: false },
    { id: 2, text: '운동하기', done: true },
    { id: 3, text: '보고서 작성', done: false }
  ];
  const list = document.getElementById('list');

  function render() {
    list.innerHTML = '';
    todos.forEach(todo => {
      const li = document.createElement('li');
      if (todo.done) li.className = 'done';
      li.innerHTML = '<input type="checkbox"' + (todo.done ? ' checked' : '') + '><span></span><button class="del">삭제</button>';
      li.querySelector('span').textContent = todo.text;
      li.querySelector('input').onchange = () => { todo.done = !todo.done; render(); };
      li.querySelector('.del').onclick = () => { todos = todos.filter(t => t !== todo); render(); };
      list.appendChild(li);
    });
    const left = todos.filter(t => !t.done).length;
    document.getElementById('count').textContent = `남은 할 일 ${left}개 / 전체 ${todos.length}개`;
  }

  bindSubmit(document.getElementById('form'), e => {
    e.preventDefault();
    const input = document.getElementById('input');
    const text = input.value.trim();
    if (!text) return;
    todos.push({ id: Date.now(), text, done: false });
    input.value = '';
    render();
  });

  render();
</script>
</body>
</html>
