<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>튀는 공</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1e1e2e; font-family: system-ui, sans-serif; }
  canvas { display: block; }
  .hint { position: fixed; top: 10px; left: 12px; color: #ccc; font-size: 13px; }
</style>
</head>
<body>
<div class="hint">클릭하면 공이 추가됩니다</div>
<canvas id="c"></canvas>
<script>
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  function resize() { canvas.width = innerWidth; canvas.height = innerHeight; }
  addEventListener('resize', resize); resize();

  const colors = ['#ff6b6b', '#ffd93d', '#6bcB77', '#4d96ff', '#c77dff'];
  const balls = [];
  function addBall(x, y) {
    balls.push({
      x, y, r: 12 + Math.random() * 14,
      vx: (Math.random() - 0.5) * 8, vy: (Math.random() - 0.5) * 8,
      color: colors[Math.floor(Math.random() * colors.length)]
    });
  }
  addBall(canvas.width / 2, canvas.height / 2);

  canvas.addEventListener('click', e => addBall(e.clientX, e.clientY));

  function loop() {
    ctx.fillStyle = '#1e1e2e';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    for (const b of balls) {
      b.x += b.vx; b.y += b.vy;
      if (b.x - b.r < 0 || b.x + b.r > canvas.width) b.vx *= -1;
      if (b.y - b.r < 0 || b.y + b.r > canvas.height) b.vy *= -1;
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
      ctx.fillStyle = b.color;
      ctx.fill();
    }
    requestAnimationFrame(loop);
  }
  loop();
</script>
</body>
</html>
