<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>매출 대시보드</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 18px 16px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: #f5f6fa; color: #222; }
  .top { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  h1 { font-size: 21px; margin: 0; }
  .seed { font-size: 12px; color: #666; display: flex; gap: 6px; align-items: center; }
  .seed button { padding: 5px 10px; border: 1px solid #ccd; background: #fff; border-radius: 6px; cursor: pointer; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 12px; }
  .kpi, .panel { background: #fff; padding: 14px; border-radius: 8px; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
  .label { font-size: 12px; color: #777; } .value { font-size: 21px; font-weight: 700; margin-top: 2px; } .d { font-size: 12px; } .up { color: #2e9e5b; } .down { color: #d64545; }
  .grid { display: grid; grid-template-columns: 1.6fr 1fr; gap: 10px; margin-bottom: 10px; }
  .panel h2 { font-size: 14px; margin: 0 0 8px; }
  .cw { position: relative; height: 220px; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; } th { text-align: left; color: #888; font-weight: 600; padding: 6px 4px; border-bottom: 1px solid #eee; } td { padding: 7px 4px; border-bottom: 1px solid #f4f4f4; } .r { text-align: right; font-variant-numeric: tabular-nums; }
  .b { font-size: 11px; padding: 1px 7px; border-radius: 999px; } .paid { background: #e7f6ee; color: #2e7d4f; } .ship { background: #e8edff; color: #3346c4; } .ref { background: #fde8e8; color: #b42318; } .wait { background: #fff4e0; color: #8a5a00; }
  @media (max-width: 760px) { .grid { grid-template-columns: 1fr; } .hide-sm { display: none; } }
</style>
</head>
<body>
<div class="top"><h1>매출 대시보드</h1><div class="seed">목업 데이터 시드 <b id="seedv"></b><button id="reseed">🎲 다시 생성</button></div></div>
<div class="kpis" id="kpis"></div>
<div class="grid">
  <div class="panel"><h2>일별 매출 (최근 90일, 주말·월급날·프로모션 반영)</h2><div class="cw"><canvas id="line"></canvas></div></div>
  <div class="panel"><h2>상품별 매출 비중</h2><div class="cw"><canvas id="pie"></canvas></div></div>
</div>
<div class="panel"><h2>최근 주문</h2><table><thead><tr><th>주문번호</th><th>일시</th><th>고객</th><th class="hide-sm">상품</th><th class="r">금액</th><th>상태</th></tr></thead><tbody id="tb"></tbody></table></div>
<script>
  // ── 현실적인 목업 데이터 생성기: 시드 PRNG + 분포 + 계절성 ──
  function mulberry32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  const LAST = ['김', '이', '박', '최', '정', '강', '조', '윤', '장', '임', '한', '오', '서', '신', '권'];
  const FIRST = ['민준', '서연', '도윤', '하은', '시우', '지유', '예준', '서윤', '주원', '지아', '하준', '수아', '건우', '채원'];
  const PRODUCTS = [['하우스 블렌드 1kg', 32900, 22], ['에티오피아 예가체프 200g', 16900, 18], ['드립백 30개입', 24900, 16], ['콜롬비아 수프리모 400g', 21900, 14], ['디카페인 400g', 23900, 9], ['파나마 게이샤 100g', 39000, 4], ['핸드드립 세트', 58000, 3], ['콜드브루 원액 1L', 18900, 14]];
  const STATUS = [['결제완료', 'paid', 62], ['배송중', 'ship', 24], ['입금대기', 'wait', 9], ['환불', 'ref', 5]];
  function generate(seed) {
    const rnd = mulberry32(seed);
    const weighted = list => { const tot = list.reduce((a, x) => a + x[x.length - 1], 0); let r = rnd() * tot; for (const x of list) if ((r -= x[x.length - 1]) <= 0) return x; return list[0]; };
    const normal = () => { let u = 0; for (let i = 0; i < 6; i++) u += rnd(); return u / 6; };   // 근사 정규분포
    const days = [], end = new Date(2024, 5, 30);
    for (let i = 89; i >= 0; i--) {
      const d = new Date(end - i * 864e5), dow = d.getDay(), dom = d.getDate();
      let base = 1500000 * (1 + (89 - i) * .004);                 // 완만한 성장 추세
      if (dow === 0 || dow === 6) base *= 1.28;                    // 주말 증가
      if (dom >= 25) base *= 1.18;                                 // 월급날 이후
      if (i >= 40 && i <= 46) base *= 1.9;                         // 5월 프로모션 주간
      days.push({ date: d, sales: Math.round(base * (.75 + normal() * .5) / 1000) * 1000 });
    }
    const orders = Array.from({ length: 12 }, (_, k) => {
      const p = weighted(PRODUCTS), qty = rnd() < .8 ? 1 : 2 + Math.floor(rnd() * 2), t = new Date(end.getTime() + 20 * 36e5 - k * (25 + rnd() * 90) * 6e4);
      return { no: `BH-2406${String(30 - Math.floor(k / 6)).padStart(2, '0')}-${String(4821 - k * 7 - Math.floor(rnd() * 6)).padStart(5, '0')}`, t, who: LAST[Math.floor(rnd() * LAST.length)] + FIRST[Math.floor(rnd() * FIRST.length)], item: p[0] + (qty > 1 ? ` × ${qty}` : ''), amt: p[1] * qty, st: weighted(STATUS) };
    });
    const mix = PRODUCTS.map(p => ({ name: p[0], v: Math.round(p[2] * p[1] * (.8 + rnd() * .4)) }));
    return { days, orders, mix };
  }
  let seed = 20240630, charts = [];
  const won = n => '₩' + n.toLocaleString('ko-KR');
  function render() {
    document.getElementById('seedv').textContent = seed;
    const { days, orders, mix } = generate(seed);
    const last30 = days.slice(-30), prev30 = days.slice(-60, -30), sum = a => a.reduce((x, d) => x + d.sales, 0);
    const cur = sum(last30), prev = sum(prev30), ordersN = Math.round(cur / 37580), aov = Math.round(cur / ordersN);
    const pct = (a, b) => ((a - b) / b * 100).toFixed(1);
    document.getElementById('kpis').innerHTML = [
      ['최근 30일 매출', won(cur), pct(cur, prev)], ['주문 수', ordersN.toLocaleString() + '건', pct(ordersN, Math.round(prev / 36900))],
      ['객단가', won(aov), pct(aov, 36900)], ['재구매율', (31 + seed % 7) + '.4%', ((seed % 5) - 1.2).toFixed(1)]
    ].map(([l, v, p]) => `<div class="kpi"><div class="label">${l}</div><div class="value">${v}</div><div class="d ${p >= 0 ? 'up' : 'down'}">${p >= 0 ? '▲' : '▼'} ${Math.abs(p)}% 직전 30일 대비</div></div>`).join('');
    charts.forEach(c => c.destroy());
    charts = [
      new Chart(document.getElementById('line'), { type: 'line', data: { labels: days.map(d => `${d.date.getMonth() + 1}/${d.date.getDate()}`), datasets: [{ data: days.map(d => d.sales / 10000), borderColor: '#4a6cf7', backgroundColor: 'rgba(74,108,247,.08)', fill: true, pointRadius: 0, borderWidth: 1.6, tension: .25 }] }, options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false }, tooltip: { callbacks: { label: c => `${c.raw.toFixed(0)}만원` } } }, scales: { x: { ticks: { maxTicksLimit: 7 } }, y: { ticks: { callback: v => v + '만' } } } } }),
      new Chart(document.getElementById('pie'), { type: 'doughnut', data: { labels: mix.map(m => m.name), datasets: [{ data: mix.map(m => m.v), backgroundColor: ['#4a6cf7', '#22c3a6', '#f5a524', '#ef6461', '#8b5cf6', '#14b8a6', '#f472b6', '#94a3b8'] }] }, options: { responsive: true, maintainAspectRatio: false, cutout: '60%', plugins: { legend: { position: 'right', labels: { boxWidth: 9, font: { size: 10 } } } } } })
    ];
    document.getElementById('tb').innerHTML = orders.map(o => `<tr><td style="font-family:ui-monospace,monospace;font-size:11px">${o.no}</td><td>${o.t.getMonth() + 1}/${o.t.getDate()} ${String(o.t.getHours()).padStart(2, '0')}:${String(o.t.getMinutes()).padStart(2, '0')}</td><td>${o.who}</td><td class="hide-sm">${o.item}</td><td class="r">${won(o.amt)}</td><td><span class="b ${o.st[1]}">${o.st[0]}</span></td></tr>`).join('');
  }
  document.getElementById('reseed').onclick = () => { seed = Math.floor(Math.random() * 1e8); render(); };
  render();
</script>
</body>
</html>
